# Agent evaluation cases (SPEC section 11). Customers/products are real ids from the data at AS_OF_DATE=2011-11-01.
# Messages were hand-written by paraphrasing product names (not copied from descriptions).

# ---------- Eval C: feedback extraction (expected write_memory arguments) ----------
feedback_extraction:
  - {id: c01, message: "Client 17239 said the hanging metal heart lanterns are still overstocked.", expect: {customer_id: "17239", outcome: declined, stock_code: "22464", reason: overstocked}}
